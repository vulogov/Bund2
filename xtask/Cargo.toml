[package]
name        = "xtask"
description = "Project tooling: oracle capture, conformance, measurement."
publish     = false

version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[dependencies]
# `cargo xtask render` checks the renderer against the goldens, so it needs
# the type it is checking.
bund2-value = { path = "../crates/bund2-value" }
bund2-api = { path = "../crates/bund2-api" }
bund2-interp = { path = "../crates/bund2-interp" }
