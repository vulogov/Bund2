name: linux-reading

# What the tree reads on Linux x86-64. `ci` ran on `main` and on pull
# requests, so a branch that is neither had no Linux run at all, and RFC-0005
# had every one of its checks taken on macOS arm64 alone. Since D150 `ci`
# runs on this branch too and is the gate; this is what `ci` does not read:
# the goldens against the oracle built here, `depth`, and the counts.
#
# Not a gate. Every step runs whatever the one before it answered, so one
# run gives the whole reading; the job is red if any step was. It wakes on a
# push that touches this file, which is how a reading is asked for: a
# workflow that is not on the default branch cannot be dispatched by hand.
on:
  push:
    branches: [development/stage2]
    paths:
      - .github/workflows/linux-reading.yml

env:
  CARGO_TERM_COLOR: always

jobs:
  reading:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: the host
        run: |
          uname -a
          rustc --version
          cargo --version
          nproc
          ulimit -s
      - name: fmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: clippy
        if: ${{ !cancelled() }}
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo clippy --workspace --all-targets
          cargo clippy --workspace --all-targets --features jit,relocation-test
      - name: the suite
        if: ${{ !cancelled() }}
        run: cargo test --workspace --no-fail-fast
      - name: the suite, with the tier
        if: ${{ !cancelled() }}
        run: cargo test --workspace --no-fail-fast --features jit,relocation-test
      - name: cite
        if: ${{ !cancelled() }}
        run: cargo xtask cite
      - name: lint
        if: ${{ !cancelled() }}
        run: cargo xtask lint
      # `-v` shows the lines at which a failing golden differs.
      - name: conform, Tier 0
        if: ${{ !cancelled() }}
        run: cargo xtask conform -v
      - name: conform, the tier at its default threshold
        if: ${{ !cancelled() }}
        run: cargo xtask conform --features jit
      - name: conform, the tier at threshold 1
        if: ${{ !cancelled() }}
        run: cargo xtask conform --features jit --jit-threshold 1
      - name: goldens unmodified
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- tests/golden/
      - name: depth
        if: ${{ !cancelled() }}
        run: cargo xtask depth --features jit
      # RFC-0005 assumption 48: how the addresses of bodies made in a row
      # spread over `Declined`'s slots is the allocator's doing.
      - name: the spread of declined bodies
        if: ${{ !cancelled() }}
        run: cargo test -p bund2-interp ten_thousand_bodies -- --nocapture

  # RFC-0005 criterion 11 as D149 words it: the floor check's cost in
  # instructions an entry, checked less unchecked. macOS reads the count from
  # `/usr/bin/time -l`, over ten million entries. A hosted runner exposes no
  # hardware counter, so this one is callgrind's `Ir`: instructions executed
  # in user space, counted and not sampled, which makes the difference exact
  # at any number of entries. One million, because the first reading took ten
  # million and two hours to say the same thing. A job of its own, so the
  # other's log is not kept waiting for it.
  floor-count:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: the floor check, by count
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          cargo build --release -p bund2-bench --example floor_count --features unguarded
          for sites in 1 4 16 64; do
            for arm in checked unchecked; do
              echo "== $arm, $sites"
              valgrind --tool=callgrind --callgrind-out-file=/dev/null \
                target/release/examples/floor_count $arm 1000000 $sites 2>&1 \
                | grep -E "floor_count|Collected"
            done
          done

  # D150: a golden the oracle does not reproduce on this host has a variant
  # here, and a variant is the oracle's capture, so it is checked where the
  # oracle runs. The capture reads which goldens the oracle answers
  # differently on Linux and holds the recorded variants to what it answers
  # now; it is given no name to write, so a variant that has moved is listed
  # and left, which fails the step, and the tree is shown to be as it was
  # checked out.
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: what the oracle will link
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev pkg-config cmake clang \
            libfontconfig1-dev libfreetype6-dev zlib1g-dev
          uname -a
          which tput && TERM=xterm COLUMNS=80 LINES=24 tput cols
      - name: build the oracle, out of tree
        run: |
          cargo build --release --manifest-path reference/Bund/Cargo.toml --target-dir target/oracle
          git -C reference/Bund status --short
      - name: what the oracle answers differently here
        if: ${{ !cancelled() }}
        run: |
          cargo xtask golden | tee capture.txt
          cat tests/golden/HOSTS.txt
          # A recorded variant the oracle no longer gives is listed among the
          # goldens that would change, by its shared name.
          grep -v '^#' tests/golden/HOSTS.txt | awk -F'\t' '$1 == "linux-x86_64" { print $2 }' > recorded.txt
          test -s recorded.txt
          sed -n '/^## existing golden would change/,$p' capture.txt > changed.txt
          ! grep -F -x -f <(sed 's/^/  /' recorded.txt) changed.txt
      - name: goldens unmodified
        if: ${{ !cancelled() }}
        run: |
          git status --short tests/golden/
          git diff --exit-code -- tests/golden/
          test -z "$(git status --porcelain tests/golden/)"
      - name: conform, Tier 0, beside the oracle
        if: ${{ !cancelled() }}
        run: cargo xtask conform -v
      - name: conform, the tier at threshold 1, beside the oracle
        if: ${{ !cancelled() }}
        run: cargo xtask conform --features jit --jit-threshold 1
