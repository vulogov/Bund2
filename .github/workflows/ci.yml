name: ci

# `development/stage2` since D150: until then `conform` could not pass off
# the machine the goldens were captured on, so a branch run had nothing to
# gate. `linux-reading` is the reading that needs the oracle or a counter,
# and stays on request.
on:
  push:
    branches: [main, development/stage2, development/0.53.0]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Every job is bounded, and every test in it (F141): a hang is a failure
  # with a name, not a run that never reports. Fifteen minutes a test is
  # `.config/nextest.toml`'s `ci` profile; the job's bound is about twice
  # the longest run so far.
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - name: the suite, each test bounded
        run: cargo nextest run --workspace --profile ci
      - name: the doc tests, which nextest does not run
        run: cargo test --workspace --doc
      - name: citations resolve at the pinned SHAs
        # Needs only the submodule sources, not a built oracle, so it belongs
        # here rather than in the conformance job. Gates RFC-0000 criterion 6
        # for every RFC from now on, and catches a submodule SHA bump that
        # invalidates citations at the commit that makes it rather than
        # whenever someone next reads an RFC.
        run: cargo xtask cite

      # Self-consistency, which `cite` cannot see: a preservation row that
      # contradicts the disposition it cites, a duplicated section heading,
      # a count that has drifted from its artefact. Two of the five review
      # blockers so far were of exactly this kind.
      - name: documents agree with themselves
        run: cargo xtask lint
      - name: feature matrix
        run: |
          cargo check --workspace --features relocation-test
          cargo check --workspace --features jit
          cargo check --workspace --features async
          cargo clippy -p bund2-runtime -p bund2-cli --all-targets --features panic-probe,jit
      # RFC-0005's criteria are mostly held by tests behind `jit`, and until
      # this step every one of them was held by a command someone ran by hand
      # (the twenty-third review's S11). `relocation-test` gates criterion 4's
      # module, which `--features jit` alone does not build.
      - name: the tier's own tests
        run: cargo nextest run --workspace --features jit,relocation-test --profile ci
      # Criterion 29 at process level: a native that panics under a compiled
      # body. No shipped native panics, so the word is the test-only
      # `test.panic`, compiled in by `panic-probe` for this one file (D220).
      - name: a panic under the tier, reported
        run: cargo nextest run -p bund2-cli --features jit,panic-probe --test panic_tier --profile ci
      # RFC-0005 criterion 15, asserted "so a later change cannot invert it
      # quietly": the mandatory vocabulary must not reach the optional tier or
      # the code generator, by any feature.
      - name: the mandatory crate does not reach the optional tier
        run: |
          if cargo tree -p bund2-stdlib --all-features --edges normal,build \
               | grep -E 'bund2-jit|cranelift'; then
            echo "bund2-stdlib depends on the tier or on Cranelift" >&2
            exit 1
          fi

  conformance:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: conformance against the oracle
        run: cargo xtask conform -v
      # The tier changes speed and not meaning, so these two read what the
      # one above reads or something is wrong. At the default threshold the
      # corpus compiles nothing; threshold 1 compiles every body it can.
      - name: conformance, the tier at its default threshold
        if: ${{ !cancelled() }}
        run: cargo xtask conform --features jit
      - name: conformance, the tier at threshold 1
        if: ${{ !cancelled() }}
        run: cargo xtask conform --features jit --jit-threshold 1
      - name: goldens unmodified
        run: git diff --exit-code -- tests/golden/

  # A gate since `deny.toml` was reconciled with the tree crate by crate
  # (D152's note of 2026-10-13). Every licence it allows and every advisory
  # it ignores is named there with its reason.
  deny:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
