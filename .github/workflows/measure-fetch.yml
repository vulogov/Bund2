name: measure-fetch

# Where a fetch goes, on the oracle and on Bund2, on Linux x86-64: the table
# `docs/measurements/fetch.py` prints, which until now exists for macOS arm64
# and one libcurl alone.
#
# **A gate since RFC-0006's criterion 14.** The table it prints is compared,
# cell for cell, with the one in `docs/measurements/fetch-linux-2026-10-09.md`,
# and a difference fails the job. So the rows where the two binaries differ
# on Linux, D133's sixteen among them, are a list a job keeps: a change to
# the fetch that moves a cell fails here, and so does a runner image whose
# libcurl reads a response another way. The answer to a failure is the
# artefact: read what moved, and either fix Bund2 or record the new table
# with the decision that approves it.
on:
  workflow_dispatch:
  push:
    branches: [development/stage2]
    # The fetch itself, and the script that measures it.
    paths:
      - .github/workflows/measure-fetch.yml
      - crates/bund2-stdlib/src/host.rs
      - crates/bund2-stdlib/src/http.rs
      - docs/measurements/fetch.py
      - docs/measurements/fetch-linux-2026-10-09.md

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: what the oracle will link
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev pkg-config cmake clang \
            libfontconfig1-dev libfreetype6-dev zlib1g-dev
          uname -a
          curl-config --version
          python3 --version
      - name: build the oracle, out of tree
        run: |
          cargo build --release --manifest-path reference/Bund/Cargo.toml --target-dir target/oracle
          git -C reference/Bund status --short
          ldd target/oracle/release/bund | grep -i -E "curl|ssl" || echo "no libcurl among the oracle's shared libraries: it is linked statically"
      - name: build Bund2
        run: cargo build -p bund2-cli
      - name: measure
        run: |
          # Port 80 is where a client goes that has lost the port it was given.
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          root="$PWD"
          mkdir -p "$RUNNER_TEMP/fetch" && cd "$RUNNER_TEMP/fetch"
          python3 "$root/docs/measurements/fetch.py" --port80 \
            "$root/target/oracle/release/bund" "$root/target/debug/bund2" > "$root/fetch-linux.md"
          wc -l "$root/fetch-linux.md"
      - name: the table
        if: always()
        run: |
          {
            echo '```'
            uname -srm
            curl-config --version || true
            ldd target/oracle/release/bund | grep -i curl || echo "libcurl: static"
            git rev-parse HEAD
            echo '```'
            cat fetch-linux.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-linux
          path: fetch-linux.md
      - name: the table is the recorded one
        run: |
          # The recorded file is prose and then the table; the table begins at
          # its heading row.
          sed -n '/^| # | setting | bund | bund2 |$/,$p' \
            docs/measurements/fetch-linux-2026-10-09.md > recorded.md
          test -s recorded.md
          diff recorded.md fetch-linux.md
