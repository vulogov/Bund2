[package]
name = "bund2-cli"
description = "The bund2 command line compiler and REPL."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
publish                = false

[[bin]]
name = "bund2"
path = "src/main.rs"

[dependencies]
bund2-stdlib.workspace = true
bund2-syntax.workspace = true
bund2-interp.workspace = true
bund2-api.workspace = true
bund2-value.workspace = true
bund2.workspace = true
# **The crate that installs the tier — F124.** `Runtime::with_options` is the
# only code that builds §S6's fragment table, declares §S8's Tier 1 share and
# installs a `JitTier`, and RFC-0000's crate table gives it that job. Until
# this dependency existed the CLI built an `Interp` directly, so
# `--features jit` enabled a feature on code that never ran and every
# measurement compared Tier 0 with itself.
bund2-runtime.workspace = true
# The OOM guard's thread and readings (D171). The flag it trips is
# `bund2_api::memguard`, which the interpreter reads.
bund2-host.workspace = true
# **The terminal's voice — D173.** Pinned at the versions already in the
# lock through other crates, where there were any. `console` styles the
# levels and decides whether a stream is a terminal; `indicatif` draws
# `build`'s progress on one; `ariadne` draws a fatal report as a traceback
# there; `human-panic` explains a panic that escapes D49's catch.
console     = "=0.15.11"
indicatif   = "=0.18.6"
ariadne     = "=0.5.1"
human-panic = "=2.0.8"
# A bundle's payload is deflated (D174): pure Rust, at the version already in
# the lock through `flate2`.
miniz_oxide = "=0.8.9"

[features]
default = []
# Chained through `bund2-runtime` rather than the `bund2` facade: the facade
# re-exports nothing, so a feature routed through it reached no code (F124).
relocation-test = ["bund2/relocation-test", "bund2-runtime/relocation-test"]
jit   = ["bund2/jit", "bund2-runtime/jit"]
# No `async`: the façade's feature links `bund2-async` and the CLI names
# none of it, so a feature here changed only a bundle's record (D168).

# `tests/terminal.rs` drives the binary at a pseudo-terminal: the prompt, its
# editing and its history exist only where standard input is a terminal, and a
# pipe reaches none of them. `rustix` is already in the lock file, through the
# line editor; this asks it for the pty calls, which are safe functions.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["pty", "fs", "termios"] }

[lints]
workspace = true
