[package]
name = "bund2-interp"
description = "Tier 0: the BundIR interpreter. Mandatory on every target. See RFC-0003."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
publish                = false

[dependencies]
bund2-ir.workspace = true
bund2-value.workspace = true
bund2-api.workspace = true
# The VM's own generator behind `Vm::rng`, seeded from the operating system
# on first use (RFC-0015 §S8). The version `bund2-api` names.
rand = "=0.8.7"

[dev-dependencies]
bund2-ir = { workspace = true, features = ["unchecked"] }

[lints]
workspace = true
