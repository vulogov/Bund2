[package]
name = "bund2-value"
description = "BundValue: the runtime value representation. See RFC-0001."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
# The wire format must be byte-identical to the reference's (D20), and the
# reference uses bincode2 with serde. bincode 2.x's `legacy()` config is the
# same encoding: fixed-int, little-endian, no varints.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
# The reference's float formatter, same major version -- `dtoa = "1.0.*"` in
# reference/rust_dynamic/Cargo.toml. Same argument as comfy-table and leon: a
# golden captures rendered text byte for byte, and `dtoa` and Rust's `{:?}`
# disagree on which shortest form to print. Both round-trip to the same f64 --
# `2.0 math.sqrt` is `F64(1.4142135623730951)` in both engines -- but the
# reference *prints* `1.4142135623730952`, so matching the renderer is the only
# way to be byte-exact.
dtoa = "1.0"

[lints]
workspace = true
