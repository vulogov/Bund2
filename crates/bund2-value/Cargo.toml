[package]
name = "bund2-value"
description = "BundValue: the runtime value representation. See RFC-0001."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
# The wire format must be byte-identical to the reference's (D20), and the
# reference uses bincode2 with serde. bincode 2.x's `legacy()` config is the
# same encoding: fixed-int, little-endian, no varints.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
