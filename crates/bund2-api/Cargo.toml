[package]
name = "bund2-api"
description = "Stable ABI for external Rust word packages. See RFC-0002."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
publish                = false

[dependencies]
bund2-value.workspace = true
# `Vm::rng` answers a VM's own `StdRng` (RFC-0015 §S8, D250 B4). rand 0.8 is
# the version statrs samples with, already in the build; `std_rng` alone, so
# this crate takes no entropy source of its own.
rand = { version = "=0.8.7", default-features = false, features = ["std_rng"] }

[lints]
workspace = true
