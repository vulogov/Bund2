[package]
name = "bund2-stdlib"
description = "The standard library: native words, effects, and JIT lowerings."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dev-dependencies]
bund2-syntax.workspace = true
bund2-interp.workspace = true

[dependencies]
# The same table library the reference draws its stack dump with, at the same
# major version — `comfy-table = "7.1.*"` in reference/Bund/Cargo.toml. Not a
# convenience: the goldens capture the exact box, and reverse-engineering the
# padding, row separators and unicode widths would be a near-miss that fails a
# golden while looking right.
comfy-table = "7.1"
# The reference's template crate, same major version -- leon = "3.0.1" in
# reference/rust_multistackvm/Cargo.toml. Same argument as comfy-table: the
# goldens capture rendered text, so the renderer has to be the same one.
leon = "3.0"
bund2-value.workspace = true
bund2-api.workspace = true
bund2-ir.workspace = true

[lints]
workspace = true
