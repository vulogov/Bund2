[package]
name = "bund2-jit"
description = "Tier 1 and AOT: BundIR to CLIF. Feature-gated. See RFC-0005, RFC-0006."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
bund2-value.workspace = true
bund2-ir.workspace = true
cranelift-codegen  = { workspace = true, optional = true }
cranelift-frontend = { workspace = true, optional = true }
cranelift-module   = { workspace = true, optional = true }
cranelift-jit      = { workspace = true, optional = true }
cranelift-object   = { workspace = true, optional = true }

[features]
default = []
# AOT via cranelift-object. Build this before the JIT: object output
# can be disassembled, diffed, and checked into a test corpus.
aot = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-module", "dep:cranelift-object"]
jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-module", "dep:cranelift-jit"]
